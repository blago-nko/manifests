# План бэкапирования экосистемы (INFRA-032)
version: 1
schedule: "weekly, Mon 05:00 UTC"
retention: "4 последних архива в ветке backups"

targets:
  - id: repo-branch
    type: git-orphan-branch
    branch: backups
    status: active
  - id: r2
    type: s3-compatible
    status: planned
    secrets_needed: [R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET]
  - id: codeberg-mirror
    type: git-mirror
    status: planned
    note: "ручная настройка владельцем (защита от vendor lock-in)"

assets:
  - docs/manifests.yaml
  - domains-graph.yaml
  - TASKS.md
  - ROADMAP.md
  - README.md
  - AGENTS.md
  - docs/STATUS.md
