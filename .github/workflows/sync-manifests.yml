name: Sync manifests metadata

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/manifests.yaml"
      - "scripts/sync_manifests.py"
      - ".github/workflows/sync-manifests.yml"

  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run sync
        run: python scripts/sync_manifests.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manifests.yaml README.md
          git add "*.md"
          if ! git diff --staged --quiet; then
            git commit -m "chore(INFRA): auto-sync manifests metadata [skip ci]"
            git push
          fi
