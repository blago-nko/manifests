name: License Compliance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check LICENSE type (MIT for code, CC BY 4.0 for docs)
        run: |
          if [ ! -f LICENSE ]; then
            echo "❌ LICENSE отсутствует"
            exit 1
          fi
          if grep -q "MIT License" LICENSE; then
            echo "✅ LICENSE: MIT (код)"
            echo "IS_CODE=true" >> $GITHUB_ENV
          else
            echo "❌ LICENSE должен быть MIT (согласно SAM-LIC-006)"
            exit 1
          fi

      - name: Check LICENSE-CONTENT (CC BY 4.0 for content)
        if: env.IS_CODE == 'true'
        run: |
          if [ ! -f LICENSE-CONTENT ]; then
            echo "❌ Отсутствует LICENSE-CONTENT (CC BY 4.0)"
            exit 1
          fi
          if grep -q "Creative Commons Attribution 4.0 International" LICENSE-CONTENT; then
            echo "✅ LICENSE-CONTENT: CC BY 4.0 (SAM-LIC-006)"
          else
            echo "❌ LICENSE-CONTENT должен быть CC BY 4.0 International"
            exit 1
          fi
