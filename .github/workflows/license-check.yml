name: License Compliance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check LICENSE type (MIT for code, CC BY-SA for docs)
        run: |
          if [ ! -f LICENSE ]; then
            echo "❌ LICENSE отсутствует"
            exit 1
          fi
          if grep -q "MIT License" LICENSE; then
            echo "✅ LICENSE: MIT (код)"
            echo "IS_CODE=true" >> $GITHUB_ENV
          elif grep -q "Attribution-ShareAlike" LICENSE; then
            echo "✅ LICENSE: CC BY-SA 4.0 (документация)"
            echo "IS_CODE=false" >> $GITHUB_ENV
          else
            echo "❌ LICENSE не распознан"
            exit 1
          fi

      - name: Check LICENSE-CONTENT (only for code repos)
        if: env.IS_CODE == 'true'
        run: |
          if [ ! -f LICENSE-CONTENT ]; then
            echo "❌ Отсутствует LICENSE-CONTENT (CC BY-SA 4.0)"
            exit 1
          fi
          grep -q "Attribution-ShareAlike" LICENSE-CONTENT && echo "✅ LICENSE-CONTENT корректен"
