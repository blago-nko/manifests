name: markdown-lint
on:
  pull_request:
    paths: ["**.md"]
  push:
    branches: [main, master, "основной"]
    paths: ["**.md"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"
