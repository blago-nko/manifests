name: Sync README Metadata

on:
  push:
    branches: [main]
    paths:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync README metadata
        run: python scripts/sync_readme_metadata.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (SAM-INFRA-008)"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(INFRA): auto-sync README metadata [skip ci]"
          git push
