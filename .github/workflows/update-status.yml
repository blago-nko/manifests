name: update-status

on:
  push:
    branches: [main, master, "основной"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Regenerate STATUS.md
        run: python scripts/update_status.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          if git diff --cached --quiet; then
            echo "STATUS.md актуален, изменений нет"
          else
            git commit -m "📈 Auto-update STATUS.md [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
