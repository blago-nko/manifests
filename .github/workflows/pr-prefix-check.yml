name: PR Prefix Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-prefix:
    name: Check PR Title Prefix
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        env:
          PR_TITLE: \${{ github.event.pull_request.title }}
        run: |
          echo "Проверяемый заголовок: $PR_TITLE"
          
          # Проверяем наличие валидного префикса в начале строки
          if [[ "$PR_TITLE" =~ ^(SAM-|CAN-|SUMKA-|GP-|MIG-|LIC-|INFRA-|feat|fix|docs|chore|test|refactor|ci|build|perf|style) ]]; then
            echo "✅ Заголовок PR соответствует стандартам"
            exit 0
          else
            echo "❌ ОШИБКА: Заголовок PR должен начинаться с валидного префикса!"
            echo "Допустимые префиксы: SAM-, CAN-, SUMKA-, GP-, MIG-, LIC-, INFRA-, feat, fix, docs, chore, test, refactor, ci, build, perf, style"
            echo "Пример: feat(INFRA): добавлены workflow для проверки префиксов PR"
            exit 1
          fi
