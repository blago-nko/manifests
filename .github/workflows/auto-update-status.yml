*Сгенерировано автоматически workflow auto-update-status.yml.*
EOF
          echo "✅ STATUS.md сгенерирован"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: автообновление STATUS.md"
          title: "docs: автообновление STATUS.md"
          body: |
            ## Автообновление STATUS.md
            
            Этот PR создан автоматически workflow auto-update-status.yml.
            
            ### Изменения:
            - Обновлена дата последнего обновления
            - Актуализирована информация о репозиториях
          branch: auto/status-update
          base: main
          labels: documentation,automated
