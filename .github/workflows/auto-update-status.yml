name: Auto-update STATUS.md

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-status:
    name: Generate STATUS.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "date=$(date -u +"%d.%m.%Y %H:%M UTC")" >> \$GITHUB_OUTPUT

      - name: Create STATUS.md
        run: |
          cat > STATUS.md << EOF
# 📈 Статус экосистемы blago-nko

> ⚠️ **Этот файл обновляется автоматически** через GitHub Actions.
> Не редактируйте вручную.

**Последнее обновление:** \${{ steps.date.outputs.date }}

---

