name: Auto-update STATUS.md

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-status:
    name: Update STATUS.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%d.%m.%Y %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Update STATUS.md
        run: |
          sed -i "s/\*\*Последнее обновление:\*\*.*/\*\*Последнее обновление:\*\* ${{ steps.date.outputs.date }}/" STATUS.md
          echo "STATUS.md updated"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: автообновление STATUS.md"
          title: "docs: автообновление STATUS.md"
          body: "Автоматическое обновление файла STATUS.md"
          branch: auto/status-update
          base: main
          labels: documentation,automated
          delete-branch: true
