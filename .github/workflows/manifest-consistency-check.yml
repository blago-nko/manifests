name: Manifest Consistency Check
on:
  pull_request:
    paths: ['**.md']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          SAM=$(grep -oP 'SAM-PRINCIPLES-COUNT: \K\d+' САМ.md || grep -oP 'Количество принципов:\*\* \K\d+' САМ.md || grep -oP 'Принципы \(все \K\d+' САМ.md || true)
          if [ -z "$SAM" ]; then
            echo "::error::В САМ.md не найдено количество принципов"
            exit 1
          fi
          echo "📌 САМ declares: $SAM принципов"
          for f in ГРЕК-ПАНТЕОН.md СУМКа.md САН.md МИГРАЦИЯ.md; do
            [ -f "$f" ] || continue
            R=$(grep -oP 'Принципы \(все \K\d+' "$f" || true)
            [ -z "$R" ] && continue
            if [ "$SAM" != "$R" ]; then
              echo "❌ $f: указано $R, но в САМ.md — $SAM"; exit 1
            fi
            echo "✅ $f: $R (OK)"
          done
          echo "🎉 Все манифесты синхронизированы"
