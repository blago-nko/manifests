name: Update Manifest Dates

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update dates in manifests
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          
          current_date = datetime.now().strftime('%Y-%m-%d')
          print(f"Current date: {current_date}")
          
          # Найти все markdown файлы
          md_files = list(Path('.').rglob('*.md'))
          print(f"Found {len(md_files)} markdown files")
          
          updated_files = []
          
          for file_path in md_files:
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Проверить наличие маркера метаданных
                  if 'MANIFEST:METADATA:BEGIN' in content:
                      # Паттерн для поиска строки с датой
                      pattern = r'(\|\s*Дата последней редакции\s*\|\s*)\d{4}-\d{2}-\d{2}(\s*\|)'
                      replacement = rf'\g<1>{current_date}\g<2>'
                      
                      new_content = re.sub(pattern, replacement, content)
                      
                      if new_content != content:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          updated_files.append(str(file_path))
                          print(f"Updated: {file_path}")
              except Exception as e:
                  print(f"Error processing {file_path}: {e}")
          
          print(f"\nTotal updated files: {len(updated_files)}")
          for f in updated_files:
              print(f"  - {f}")
          PYTHON_SCRIPT

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(AUTO): обновлена дата последней редакции в манифестах"
          file_pattern: "*.md"
          commit_options: "--no-verify"
